<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knights' Quest: Winchester P.S. Math Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Grenze+Gotisch:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b75bc;--blue-d:#0f4f85;--navy:#12283d;--gold:#e0a526;--gold-d:#7a5510;--parch:#f3d9a8;--parch-l:#fdf4de;--ink:#1d2630;--steel:#aab5bf;--ok:#2e9e5b;--bad:#d64545;--warn:#e58a1f;--r:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:17px;line-height:1.4;background:var(--navy)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{margin:0 0 .4em;line-height:1.15}h2{font-size:1.6rem}h3{font-size:1.1rem;margin-top:1.2em}p{margin:.3em 0 .8em}
#app{min-height:100vh;display:flex;flex-direction:column}
#app.bg-night{background:radial-gradient(1200px 600px at 50% -10%,#2a5d8f 0,#12283d 60%,#0b1a29 100%);align-items:center;justify-content:center;padding:20px}
#app.bg-day{background:linear-gradient(#bfe3f7 0,#e9f6e4 55%,#cfe8b9 100%)}
#app.bg-paper{background:#f4f1ea}
.card{background:var(--parch-l);border:4px solid var(--gold-d);border-radius:22px;padding:28px 32px;width:min(760px,100%);box-shadow:0 10px 0 rgba(0,0,0,.25),inset 0 0 0 4px var(--parch);position:relative}
.card.narrow{width:min(520px,100%)}.center{text-align:center}
.btn{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:8px 18px;font-weight:600;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--navy);box-shadow:0 4px 0 var(--navy)}
.btn.big{font-size:1.25rem;padding:12px 26px}.btn.sm{font-size:.9rem;padding:5px 12px;border-width:2px;box-shadow:0 2px 0 var(--ink)}.btn.warn{background:var(--bad);color:#fff}
.btn:focus-visible,.ch:focus-visible,.key:focus-visible,.realm:focus-visible,.door:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.back{background:none;border:0;font-weight:600;color:var(--blue-d);padding:4px 0;display:block;margin-bottom:6px}.back.dark{color:var(--blue-d)}
.err{color:var(--bad);font-weight:600;min-height:1.3em}.muted{color:#5d6975;font-size:.92rem;font-weight:400}
.demo{background:rgba(255,255,255,.12);color:#dbe9f5;border:1px dashed #7fa6c9;border-radius:12px;padding:10px 14px;font-size:.88rem;max-width:620px;margin:22px auto 0;text-align:center}
.card .demo{background:#fff6dd;color:#6b5210;border-color:var(--gold)}
.spin{width:44px;height:44px;border:5px solid var(--parch);border-top-color:var(--blue);border-radius:50%;margin:10px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.grow{flex:1}
/* home */
.home{width:min(820px,100%);text-align:center}.hero{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap}
.logo{width:230px;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}.logo.sm{width:110px}.logo.xs{width:38px;filter:none}
.title{font-family:'Grenze Gotisch','Fredoka',serif;font-size:clamp(3rem,9vw,5.2rem);color:var(--parch);text-shadow:0 4px 0 #0b1a29,0 0 30px rgba(224,165,38,.35);font-weight:800;letter-spacing:.5px}
.sub{color:#cfe2f2;font-size:1.2rem}
.doors{display:flex;gap:22px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.door{background:var(--parch-l);border:4px solid var(--gold-d);border-radius:22px;padding:22px 30px;min-width:250px;box-shadow:0 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.door:hover{transform:translateY(-4px)}.door .di{font-size:3rem}.door b{font-size:1.4rem}.door small{color:#5d6975}.door.alt{background:#e7eef5}
/* join */
.codein{display:block;margin:8px auto 18px;font-size:2.4rem;letter-spacing:.35em;text-align:center;width:min(340px,100%);padding:10px 8px 10px 18px;border:4px solid var(--blue);border-radius:16px;font-weight:700;background:#fff;text-transform:uppercase}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.rb{background:#fff;border:3px solid var(--blue);border-radius:14px;padding:14px 8px;font-weight:600;font-size:1.1rem;box-shadow:0 4px 0 var(--blue-d)}.rb.new{background:var(--gold);border-color:var(--gold-d);box-shadow:0 4px 0 var(--gold-d)}
.lab{display:block;font-weight:600;margin:12px 0 6px}.lab input{display:block;width:100%;margin-top:6px;padding:10px 14px;font-size:1.3rem;border:3px solid var(--blue);border-radius:12px;text-align:center}
.crests{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 18px}
.cb{font-size:1.9rem;background:#fff;border:3px solid var(--steel);border-radius:14px;padding:6px 0;aspect-ratio:1}.cb.sel{border-color:var(--gold);background:#fff3cc;box-shadow:0 0 0 4px var(--gold)}.cb:disabled{opacity:.3}
.story .stage{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:210px}.sicon{font-size:5rem}.stxt{font-size:1.35rem;font-weight:500;min-height:3.6em}
/* knight */
.knight{width:170px;height:auto;overflow:visible}.knight.mini{width:54px}.knight.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pet{font-size:2.6rem;margin-left:-18px;align-self:flex-end;animation:bob 1.8s ease-in-out infinite}
/* top bar */
.bar{display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;padding:8px 18px;border-bottom:4px solid var(--gold)}
.who{display:flex;align-items:center;gap:10px}.who b{display:block;font-size:1.1rem}.who span{font-size:.85rem;color:var(--parch)}
.xp{width:130px;height:8px;background:#2c4a66;border-radius:8px;overflow:hidden;margin-top:3px}.xp i{display:block;height:100%;background:var(--gold)}
.stats{display:flex;gap:16px;font-size:1.15rem;margin-left:auto}.acts{display:flex;gap:6px}
.acts button{background:#1f3d5a;border:2px solid #3b6288;color:#fff;border-radius:12px;padding:4px 10px;font-size:1.2rem;display:flex;flex-direction:column;align-items:center;line-height:1.1}.acts small{font-size:.62rem;font-weight:500}
.hub{padding:18px 22px 30px;width:min(1180px,100%);margin:0 auto;flex:1}.maph{text-align:center;margin:6px 0 16px}
.realms{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.realm{position:relative;border:4px solid var(--navy);border-radius:22px;padding:26px 12px 16px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 8px 0 rgba(18,40,61,.55);transition:transform .1s;min-height:230px;justify-content:center}
.realm:hover{transform:translateY(-5px)}.ri{font-size:3.6rem}.realm b{font-size:1.3rem}.realm small{opacity:.9}
.rp{width:80%;height:10px;border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:8px}.rp i{display:block;height:100%;background:var(--gold)}.rs{font-size:.95rem;margin-top:4px}
.royal{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--gold);color:var(--ink);font-style:normal;font-weight:600;font-size:.8rem;padding:3px 12px;border-radius:20px;border:3px solid var(--navy)}
.r-B{background:linear-gradient(160deg,#2f8f55,#1c5c3a)}.r-C{background:linear-gradient(160deg,#7a63c9,#3f3384)}.r-E{background:linear-gradient(160deg,#6f8296,#3c4c5e)}.r-D{background:linear-gradient(160deg,#2aa3b5,#125f78)}.r-F{background:linear-gradient(160deg,#d9932a,#99580f)}
.train{display:flex;gap:26px;align-items:center;background:var(--parch-l);border:4px solid var(--gold-d);border-radius:22px;padding:24px 28px;max-width:860px;margin:10px auto;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.speech{background:#fff;border:3px solid var(--blue);border-radius:16px;padding:10px 14px}
.trials{list-style:none;padding:0;margin:12px 0 18px;display:flex;flex-wrap:wrap;gap:8px}.trials li{background:#fff;border:3px solid var(--steel);border-radius:12px;padding:6px 12px;font-weight:600;display:flex;gap:6px;align-items:center}
.trials .cur{border-color:var(--gold);background:#fff3cc}.trials .lock{opacity:.55}.trials .done{border-color:var(--ok)}
/* battle */
.battle{flex:1;display:flex;flex-direction:column;background:none!important}
.btop{display:flex;align-items:center;gap:14px;padding:6px 18px;background:var(--navy);color:#fff}.btop .back{color:var(--parch);margin:0}
.pips{display:flex;gap:6px;margin:0 auto}.pips i{width:30px;height:14px;border-radius:8px;background:#2c4a66;border:2px solid #4c7096}.pips i.on{background:var(--gold);border-color:#fff3cc;box-shadow:0 0 8px var(--gold)}
.coinc{font-size:1.1rem}
.scene{position:relative;height:230px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 max(6vw,20px) 6px;overflow:hidden;border-bottom:5px solid var(--navy)}
.r-B .scene{background:linear-gradient(#a9dcf5 0,#d6f0d0 62%,#4c9a57 62%,#3a7f47 100%)}.r-C .scene{background:linear-gradient(#c9c3f0 0,#ece6fa 62%,#8a7bb8 62%,#6a5a9c 100%)}.r-E .scene{background:linear-gradient(#c5d3e0 0,#e7edf3 62%,#8b99a8 62%,#6c7b8b 100%)}.r-D .scene{background:linear-gradient(#aee4ee 0,#dff6f4 62%,#2f9fb4 62%,#1c7c92 100%)}.r-F .scene{background:linear-gradient(#ffe2a8 0,#fff3d6 62%,#c98a3a 62%,#a86c22 100%)}
.kn{display:flex;align-items:flex-end;z-index:2}.scene .knight{width:158px}
.cr{--g:1;display:flex;flex-direction:column;align-items:center;z-index:2;margin-right:3vw}
.crE{font-size:6.4rem;line-height:1.1;filter:grayscale(var(--g)) brightness(calc(1 - var(--g)*.4));transition:filter .6s;display:block;animation:bob 2s ease-in-out infinite}
.crN{background:var(--navy);color:#fff;border-radius:20px;padding:1px 14px;font-weight:600;font-size:.9rem}
.cr::before{content:'☁️';position:absolute;font-size:3rem;transform:translate(10px,-78px);opacity:calc(var(--g)*.9);filter:grayscale(1) brightness(.6);transition:opacity .6s}
.beam{position:absolute;left:calc(max(6vw,20px) + 150px);right:calc(max(6vw,20px) + 3vw + 70px);bottom:86px;height:16px;border-radius:10px;background:linear-gradient(90deg,#8fd0fa,#fff7c2,#ffe066);opacity:0;transform-origin:left;transform:scaleX(0)}
.scene.cast .beam{animation:beam .7s ease-out}.scene.cast .kn{animation:lunge .5s}.scene.cast .crE{animation:hop .7s}
.scene.oops .kn{animation:shake .4s}
@keyframes beam{0%{opacity:1;transform:scaleX(0)}60%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes lunge{40%{transform:translateX(26px)}}@keyframes hop{40%{transform:translateY(-22px) rotate(8deg)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qp{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:20px;padding:16px max(3vw,14px) 20px;background:var(--parch-l);align-items:start}
.qhead{display:flex;gap:12px;align-items:flex-start}.say{flex:none;font-size:1.3rem;background:#fff;border:3px solid var(--blue);border-radius:50%;width:46px;height:46px}
.qtext{font-size:1.45rem;font-weight:600;line-height:1.3;padding-top:4px}
.qvis{margin:12px 0 4px;display:flex;justify-content:center;background:#fff;border:3px solid var(--parch);border-radius:16px;padding:12px;overflow-x:auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices.n3,.choices.n5{grid-template-columns:1fr}.choices.n3 .ch,.choices.n5 .ch{min-height:58px}
.ch{background:#fff;border:4px solid var(--blue);border-radius:16px;min-height:84px;font-size:1.6rem;font-weight:600;box-shadow:0 5px 0 var(--blue-d);padding:8px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.ch:hover:not(:disabled){transform:translateY(-2px);background:#eef7fd}.ch.right{background:#d9f5e3;border-color:var(--ok);box-shadow:0 5px 0 #1d7040}.ch.wrong{background:#fde3e3;border-color:var(--bad);box-shadow:none;opacity:.6}
.numrow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.7rem;font-weight:600;margin-bottom:10px}
.numbox{min-width:170px;height:60px;border:4px solid var(--blue);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;padding:0 12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.key{background:#fff;border:3px solid var(--navy);border-radius:12px;font-size:1.4rem;font-weight:600;height:48px;box-shadow:0 3px 0 var(--navy)}.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.key.wide{grid-column:span 1}.key.go{grid-column:span 2;background:var(--ok);color:#fff}
.skip{display:block;margin:14px auto 0;background:none;border:0;color:#5d6975;text-decoration:underline;font-size:.95rem}
.fb{margin-top:12px;border-radius:16px;padding:0;min-height:20px}.fb b{display:block;font-size:1.15rem}.fb span{display:block;margin-top:4px}
.fb.good{background:#d9f5e3;border:3px solid var(--ok);padding:10px 14px}.fb.hint{background:#fff3cc;border:3px solid var(--gold);padding:10px 14px}.fb.show{background:#e6f1fa;border:3px solid var(--blue);padding:12px 14px}
.fb .ans{font-weight:700;font-size:1.15rem}.fb .btn{margin-top:10px}.fb .streak{display:inline}
/* visuals */
.emrow{display:grid;grid-template-columns:repeat(5,auto);gap:4px 8px;font-size:2rem;line-height:1.15;justify-content:center}.emrow .gone{opacity:.25;text-decoration:line-through;filter:grayscale(1)}
.two{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}.box{border:3px dashed var(--steel);border-radius:14px;padding:8px 10px;background:#fbfdff}.box h5{margin:0 0 4px;text-align:center;font-size:1rem}.box .emrow{font-size:1.6rem;grid-template-columns:repeat(3,auto)}.op{font-size:2rem;font-weight:700}
.tf{display:grid;gap:4px;background:var(--navy);padding:4px;border-radius:8px}.tf i{width:40px;height:40px;background:#fff;border-radius:4px;display:block;position:relative}.tf i.on::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bad)}
.dots{display:grid;grid-template-columns:repeat(3,34px);gap:8px;padding:12px;background:#fff;border:3px solid var(--navy);border-radius:14px}.dots i{width:34px;height:34px;border-radius:50%}.dots i.on{background:var(--blue)}
.b10{display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap;justify-content:center}.bh{width:90px;height:90px;background:repeating-linear-gradient(0deg,transparent 0 8px,#0f4f85 8px 9px),repeating-linear-gradient(90deg,#5aa9e0 0 8px,#0f4f85 8px 9px);border:2px solid var(--blue-d);display:block}
.bt{width:11px;height:90px;background:repeating-linear-gradient(0deg,#5aa9e0 0 8px,#0f4f85 8px 9px);border:2px solid var(--blue-d);display:block}.bos{display:grid;grid-template-columns:repeat(3,auto);gap:4px;align-content:end;margin-left:8px}.bo{width:11px;height:11px;background:#e0a526;border:2px solid var(--gold-d);display:block}
.arr{display:grid;gap:7px}.arr i{width:20px;height:20px;border-radius:50%;background:var(--blue);display:block}
.fb{}.fb i{}
span.fb{display:inline-flex;margin:0;min-height:0;width:150px;height:34px;border:3px solid var(--navy);border-radius:6px;overflow:hidden;background:#fff;padding:0}span.fb i{flex:1;border-right:2px solid var(--navy)}span.fb i:last-child{border-right:0}span.fb i.on{background:var(--gold)}
.fbs{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.fbs>div{display:flex;align-items:center;gap:12px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.92em;line-height:1.05}.fr b{font-weight:600;padding:0 4px}.fr b:first-child{border-bottom:3px solid currentColor}
.var{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.seq{display:flex;gap:10px;font-size:1.9rem;font-weight:600;flex-wrap:wrap;justify-content:center;align-items:center}.seq span,.seq b{background:#fff;border:3px solid var(--steel);border-radius:12px;min-width:54px;padding:2px 10px;text-align:center}.seq b,.bigq b{color:var(--blue);border-color:var(--blue);background:#e6f1fa}
.bigq{font-size:2.2rem;font-weight:600;text-align:center}.bigq b{border:3px solid var(--blue);border-radius:10px;padding:0 12px}.ol{border-top:3px solid currentColor;padding:0 3px}
.bars{display:flex;flex-direction:column;gap:12px;align-items:flex-start;width:240px}.bars i{height:22px;border-radius:6px;display:block;border:2px solid var(--ink)}
.pict{display:flex;flex-direction:column;gap:6px;min-width:260px}.pict div{display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--parch);padding-bottom:4px}.pict b{width:84px;text-align:right;font-size:1rem}.pict span{font-size:1.5rem;letter-spacing:3px}
.coins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end}.coin{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem}.coin i{width:var(--z);height:var(--z);border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--z)*.5);background:radial-gradient(circle at 35% 30%,#f4f6f8,#aab5bf);border:3px solid #6c7783}
.c-loonie i{background:radial-gradient(circle at 35% 30%,#ffe9a6,#d49a1c);border-color:#8a6410}.c-toonie i{background:radial-gradient(circle,#f0c14a 0 48%,#dfe5ea 50% 100%);border-color:#6c7783}.coin b{font-weight:600}
.data{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.data span{background:#fff;border:3px solid var(--blue);border-radius:10px;padding:2px 12px;font-size:1.5rem;font-weight:600}
.tv{border-collapse:collapse;font-size:1.25rem}.tv td,.tv th{border:3px solid var(--navy);padding:4px 14px;text-align:center;background:#fff}.tv th{background:var(--blue);color:#fff}
svg.vis{max-width:100%;height:auto}svg.vis text{font-family:'Fredoka',sans-serif}
.ch .fb,.ch span.fb{width:130px}
/* reward, armoury, friends */
.reward .burst{font-size:6rem;animation:pop .6s}.reward .crE{--g:0;filter:none}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}}
.loot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}.loot span{background:#fff;border:3px solid var(--gold);border-radius:20px;padding:4px 16px;font-weight:600;font-size:1.15rem}.gain{font-weight:600;color:var(--blue-d)}
.armoury{display:flex;gap:26px;background:var(--parch-l);border:4px solid var(--gold-d);border-radius:22px;padding:20px 24px;flex-wrap:wrap}.aprev{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;width:240px}.aprev .err{width:100%;text-align:center}.aopts{flex:1;min-width:280px}.aopts h3:first-child{margin-top:0}
.shop{display:flex;gap:10px;flex-wrap:wrap}.item{background:#fff;border:3px solid var(--steel);border-radius:14px;padding:8px 10px;min-width:78px;display:flex;flex-direction:column;align-items:center;gap:4px}.item.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:block}.sw.sq{border-radius:8px}.pe{font-size:1.8rem;line-height:1.2}
.fh{margin:14px 0 6px}.friends{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.fr1{background:#fff;border:3px solid var(--blue);border-radius:14px;text-align:center;padding:6px 2px}.fr1 span{font-size:2.2rem;display:block}.fr1 b{font-size:.8rem}.fr1.lock{border-color:var(--steel)}.fr1.lock span{filter:brightness(0);opacity:.22}
/* teacher */
.tw{flex:1;font-family:'Fredoka',system-ui,sans-serif;font-size:15.5px}
.thead{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 22px;border-bottom:4px solid var(--gold)}.thead b{font-family:'Grenze Gotisch',serif;font-size:1.6rem;color:var(--parch)}.tsub{color:#cfe2f2}.thead .btn{color:var(--ink)}.tname{font-size:.9rem;color:#cfe2f2}
.tmain{width:min(1180px,100%);margin:0 auto;padding:18px 22px 40px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:24px}.ccard{background:#fff;border:2px solid #d5d0c4;border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:3px;border-left:8px solid var(--blue)}.ccard:hover{border-color:var(--blue)}.ccard b{font-size:1.15rem}.ccard span{color:#5d6975;font-size:.9rem}.ccard code{font-size:1.1rem;letter-spacing:.2em;color:var(--blue-d);font-weight:700}
.newc{background:#fff;border:2px solid #d5d0c4;border-radius:14px;padding:16px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}.newc h3{width:100%;margin:0}.newc label{display:flex;flex-direction:column;font-size:.85rem;font-weight:600;gap:4px}.newc input,.newc select,.legend select,.ilink input{padding:8px 10px;border:2px solid #b9c2cb;border-radius:10px;background:#fff;font-size:1rem}.newc input{min-width:260px}.newc .err,.newc .muted{width:100%;margin:0}
.invite{display:flex;gap:26px;align-items:center;background:#fff;border:2px solid #d5d0c4;border-radius:14px;padding:14px 18px;flex-wrap:wrap}.invite>div{display:flex;flex-direction:column;gap:5px}.bigcode{font-size:2.4rem;font-weight:700;letter-spacing:.25em;color:var(--blue-d)}.ilink{flex:1;min-width:280px}.ilink input{width:100%}.ilink .row{justify-content:flex-start;gap:8px}
.tabs{display:flex;gap:4px;margin:20px 0 0;border-bottom:3px solid var(--navy)}.tabs button{background:#e2ddd2;border:0;border-radius:12px 12px 0 0;padding:9px 20px;font-weight:600}.tabs .sel{background:var(--navy);color:#fff}
.tbody{background:#fff;border:2px solid #d5d0c4;border-top:0;border-radius:0 0 14px 14px;padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tiles div{background:#f4f1ea;border-radius:12px;padding:12px 14px}.tiles b{display:block;font-size:1.8rem;color:var(--blue-d)}.tiles span{font-size:.85rem;color:#5d6975}
.tb{width:100%;border-collapse:collapse;font-size:.95rem}.tb th{text-align:left;font-size:.8rem;color:#5d6975;font-weight:600;padding:6px 8px;border-bottom:2px solid #d5d0c4;vertical-align:bottom}.tb th small{display:block;font-weight:400;font-size:.7rem}.tb td{padding:7px 8px;border-bottom:1px solid #ebe7de;vertical-align:middle}
.tb.stu tbody tr{cursor:pointer}.tb.stu tbody tr:hover{background:#f0f6fb}.tb .sep td{background:#f4f1ea;font-weight:600}
.lv{display:inline-flex;min-width:30px;height:26px;align-items:center;justify-content:center;border-radius:8px;font-weight:600;font-size:.9rem;padding:0 6px;border:2px solid}.lv.wide{font-size:.78rem;white-space:nowrap}
.lv.low{background:#fde3e3;border-color:var(--bad);color:#8f1f1f}.lv.near{background:#fff0d4;border-color:var(--warn);color:#7a4a08}.lv.on{background:#d9f5e3;border-color:var(--ok);color:#145c31}.lv.up{background:#dcecfa;border-color:var(--blue);color:#0f4f85}.lv.none{border-color:#d5d0c4;color:#9aa3ac}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#ebe7de;min-width:120px}.dist i{display:block}.dist .low{background:var(--bad)}.dist .near{background:var(--warn)}.dist .on{background:var(--ok)}.dist .up{background:var(--blue)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#eef3f8;border-radius:6px;padding:1px 7px;font-size:.85rem;white-space:nowrap;color:var(--blue-d);font-weight:600}
.st{font-size:.8rem;background:#fff0d4;border-radius:20px;padding:2px 10px;white-space:nowrap}.st.ok{background:#d9f5e3}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:.85rem}.key2{display:flex;gap:6px;align-items:center}.key2 i{width:14px;height:14px;border-radius:4px;display:inline-block;margin-left:8px}.key2 .m{background:var(--ok)}.key2 .l{background:var(--warn)}.key2 .s{background:var(--bad)}
.scroll{overflow-x:auto}.scroll.tall{max-height:300px;overflow-y:auto}.danger{margin-top:22px;display:flex;justify-content:flex-end;gap:8px}
.modal{position:fixed;inset:0;background:rgba(18,40,61,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20;font-size:15.5px}.mcard{background:#fff;border-radius:16px;padding:22px 26px;width:min(860px,100%);position:relative}.mx{position:absolute;top:14px;right:14px}
.board{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#2a5d8f 0,#12283d 60%);color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.board .btn{position:absolute;top:18px;right:18px;color:var(--ink)}.board .logo{width:150px}.board h1{font-size:2.6rem;color:var(--parch)}.board ol{text-align:left;font-size:1.7rem;line-height:1.6}.board code{font-size:clamp(3rem,11vw,7rem);font-weight:700;background:var(--parch-l);color:var(--navy);border-radius:22px;padding:6px 34px;border:6px solid var(--gold);letter-spacing:.05em}
@media (max-width:820px){.qp{grid-template-columns:1fr}.scene{height:150px}.scene .knight{width:98px}.crE{font-size:4rem}.train{flex-direction:column}.friends{grid-template-columns:repeat(4,1fr)}.bar{flex-wrap:wrap}.acts small{display:none}.qtext{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<script>
/* ===== Question bank: every skill is tagged to an Ontario expectation =====
   g: 0 = Kindergarten Curriculum (2026); 1-8 = Mathematics (2020), Grades 1-8
   s: B Number, C Algebra, D Data, E Spatial Sense, F Financial Literacy      */
const Skills = (function () {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[R(0, a.length - 1)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const rnd = x => Math.round(x * 1000) / 1000;
  const grp = s => s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : s;
  const fmt = n => {
    if (typeof n !== 'number') return String(n);
    let s = String(Math.round(n * 1e6) / 1e6), neg = s[0] === '-'; if (neg) s = s.slice(1);
    const [i, d] = s.split('.');
    return (neg ? '−' : '') + grp(i) + (d ? '.' + d : '');
  };
  const money = x => '$' + (Math.round(x * 100) / 100).toFixed(2);
  const fr = (n, d) => `<span class="fr" data-s="${String(n).replace(/<[^>]+>/g, '')} over ${d}"><b>${n}</b><b>${d}</b></span>`;
  const frS = (n, d) => { const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : fr(n, d); };
  const sgn = n => n < 0 ? `(${fmt(n)})` : fmt(n);
  const V = c => `<i class="var">${c}</i>`;

  function near(a, o) {
    o = o || {}; const st = o.step || 1, min = o.min === undefined ? 0 : o.min;
    let c = [a + st, a - st, a + 2 * st, a - 2 * st, a + 3 * st, a - 3 * st];
    if (st === 1 && a >= 20) c.push(a + 10, a - 10);
    c = c.map(rnd).filter(x => x >= min);
    return shuffle(c.slice(0, 4)).concat(c.slice(4));
  }
  const lab = x => typeof x === 'number' ? fmt(x) : String(x);
  function MC(q, correct, wrongs, o) {
    const num = typeof correct === 'number' && wrongs.every(w => typeof w === 'number');
    const seen = new Set([lab(correct)]), ws = [];
    for (const w of wrongs) {
      if (typeof w === 'number' && !isFinite(w)) continue;
      const l = lab(w); if (!seen.has(l)) { seen.add(l); ws.push(w); } if (ws.length >= 3) break;
    }
    let all = [correct, ...ws];
    if (num) all.sort((a, b) => a - b); else all = shuffle(all);
    return Object.assign({ type: 'mc', q, ch: all.map(lab), ai: all.indexOf(correct) }, o || {});
  }
  const MCF = (q, labels, ai, o) => Object.assign({ type: 'mc', q, ch: labels, ai }, o || {});
  const NUM = (q, a, o) => Object.assign({ type: 'num', q, a: Math.round(a * 1e6) / 1e6 }, o || {});

  /* ---------- visuals ---------- */
  const em = (e, n, cls) => `<div class="emrow ${cls || ''}">${Array.from({ length: n }, () => `<span>${e}</span>`).join('')}</div>`;
  const frame = (cells, n) => `<div class="tf" style="grid-template-columns:repeat(${Math.min(5, cells)},1fr)">${Array.from({ length: cells }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;
  const dots = n => { const P = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8] }; const on = R(0, 1) ? P[n] : shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, n); return `<div class="dots">${Array.from({ length: 9 }, (_, i) => `<i class="${on.includes(i) ? 'on' : ''}"></i>`).join('')}</div>`; };
  const blocks = (h, t, o) => `<div class="b10">${'<i class="bh"></i>'.repeat(h)}${'<i class="bt"></i>'.repeat(t)}<span class="bos">${'<i class="bo"></i>'.repeat(o)}</span></div>`;
  const arr = (r, c) => `<div class="arr" style="grid-template-columns:repeat(${c},1fr)">${'<i></i>'.repeat(r * c)}</div>`;
  const fbar = (n, d) => `<span class="fb">${Array.from({ length: d }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
  const seq = a => `<div class="seq">${a.map(x => x === '?' ? '<b>?</b>' : `<span>${typeof x === 'number' ? fmt(x) : x}</span>`).join('')}</div>`;
  const big = s => `<div class="bigq">${s}</div>`;
  const svg = (w, h, inner) => `<svg class="vis" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${inner}</svg>`;
  const SH = {
    circle: ['<circle cx="50" cy="50" r="40"/>', 0], triangle: ['<polygon points="50,10 92,88 8,88"/>', 3],
    square: ['<rect x="14" y="14" width="72" height="72"/>', 4], rectangle: ['<rect x="4" y="26" width="92" height="48"/>', 4],
    pentagon: ['<polygon points="50,8 92,40 76,90 24,90 8,40"/>', 5], hexagon: ['<polygon points="27,10 73,10 96,50 73,90 27,90 4,50"/>', 6],
    octagon: ['<polygon points="32,8 68,8 92,32 92,68 68,92 32,92 8,68 8,32"/>', 8],
    rhombus: ['<polygon points="50,4 78,50 50,96 22,50"/>', 4], trapezoid: ['<polygon points="30,24 70,24 94,78 6,78"/>', 4]
  };
  const COL = ['#1b75bc', '#e0a526', '#2e9e5b', '#d64545', '#7b4bc4'];
  const shape = n => svg(100, 100, `<g fill="${pick(COL)}" stroke="#1d2630" stroke-width="3" stroke-linejoin="round">${SH[n][0]}</g>`);
  const clock = (h, m) => {
    let t = ''; for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; t += `<text x="${(70 + 50 * Math.sin(a)).toFixed(1)}" y="${(75 - 50 * Math.cos(a)).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2630">${i}</text>`; }
    for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, r1 = i % 5 ? 62 : 59; t += `<line x1="${(70 + r1 * Math.sin(a)).toFixed(1)}" y1="${(70 - r1 * Math.cos(a)).toFixed(1)}" x2="${(70 + 65 * Math.sin(a)).toFixed(1)}" y2="${(70 - 65 * Math.cos(a)).toFixed(1)}" stroke="#1d2630" stroke-width="${i % 5 ? 0.8 : 2}"/>`; }
    const hand = (deg, len, w, c) => { const a = deg * Math.PI / 180; return `<line x1="70" y1="70" x2="${(70 + len * Math.sin(a)).toFixed(1)}" y2="${(70 - len * Math.cos(a)).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; };

  add('g2_cmp', 'B', 2, 'B1.2', 'Compare and order numbers to 200', 'Compare hundreds first, then tens, then ones.', () => {

  add('g6_pct', 'B', 6, 'B2.3', 'Mental math with percents', '10% is ÷ 10. 5% is half of that. 25% is ÷ 4. 50% is half. 1% is ÷ 100.', () => {

  const fadd = (prs, code) => () => {

/* ===== Adaptive engine: hidden placement, mastery tracking, spaced review ===== */
const Engine = (function (Skills) {
  const STR = ['B', 'C', 'E', 'D', 'F'];
  const INFO = {
    B: { name: 'Number', realm: 'Number Forest', icon: '🌲' },
    C: { name: 'Algebra', realm: 'Pattern Peaks', icon: '⛰️' },
    E: { name: 'Spatial Sense', realm: 'Shape Citadel', icon: '🏰' },
    D: { name: 'Data', realm: 'Data Docks', icon: '⚓' },
    F: { name: 'Financial Literacy', realm: 'Golden Market', icon: '🪙' }
  };
  const PN = { B: 6, C: 4, E: 4, D: 4, F: 4 };           // placement questions per strand
  const PTOTAL = STR.reduce((t, s) => t + PN[s], 0);
  const MAXG = 8, ALPHA = 0.34;
  const R = Skills.R, pick = Skills.pick;
  const clamp = g => Math.max(0, Math.min(MAXG, g));
  const at = (s, g) => Skills.list.filter(k => k.s === s && k.g === g);
  const gl = g => g === 0 ? 'K' : 'Gr ' + g;

  function newState(grade) {
    const st = { v: 1, g: grade, placed: false, pl: { i: 0, q: 0, lv: {}, h: {}, seen: [] }, lvl: {}, plv: {}, sk: {}, rec: {}, xp: 0, coins: 0, tot: 0, cor: 0, secs: 0, friends: [], gear: { plume: 'blue', cape: 'blue', pet: '' }, own: [], hist: [], last: 0, sup: null, lastSk: '' };
    STR.forEach(s => { st.pl.lv[s] = clamp(grade - 1); st.pl.h[s] = []; st.rec[s] = []; });
    return st;
  }
  const mastered = (st, id) => { const k = st.sk[id]; return !!k && k.n >= 5 && k.m >= 0.8; };
  const struggling = (st, id) => { const k = st.sk[id]; return !!k && k.n >= 4 && k.m < 0.45; };

  function track(st, skill, ok) {
    const k = st.sk[skill.id] || (st.sk[skill.id] = { n: 0, c: 0, m: 0, w: 0, t: 0 });
    const was = mastered(st, skill.id);
    k.n++; if (ok) k.c++; k.m = Math.round((k.m + ALPHA * ((ok ? 1 : 0) - k.m)) * 1000) / 1000; k.w = ok ? 0 : k.w + 1; k.t = Date.now();
    st.tot++; if (ok) st.cor++; st.last = Date.now(); st.lastSk = skill.id;
    st.hist.push({ k: skill.id, c: ok ? 1 : 0, t: Date.now() }); if (st.hist.length > 40) st.hist.shift();
    return !was && mastered(st, skill.id);
  }

  /* ---- placement: a short up/down staircase in each strand ---- */
  function placementNext(st) {
    const s = STR[st.pl.i], g = st.pl.lv[s]; let pool = at(s, g).filter(k => !st.pl.seen.includes(k.id)); if (!pool.length) pool = at(s, g);
    return { skill: pick(pool), s, mode: 'place' };
  }
  function placementAnswer(st, skill, ok) {
    const s = STR[st.pl.i], p = st.pl, g = p.lv[s]; track(st, skill, ok); p.seen.push(skill.id); p.h[s].push(g);
    const step = p.q === 0 ? 2 : 1; p.lv[s] = clamp(g + (ok ? step : -step)); p.q++;
    let strandDone = false;
    if (p.q >= PN[s]) {
      const v = p.h[s].slice(2).concat(p.lv[s]); st.plv[s] = st.lvl[s] = clamp(Math.round(v.reduce((a, b) => a + b, 0) / v.length));
      p.i++; p.q = 0; strandDone = true; if (p.i >= STR.length) st.placed = true;
    }
    return { strandDone, allDone: st.placed };
  }
  const placementCount = st => st.placed ? PTOTAL : STR.slice(0, st.pl.i).reduce((t, s) => t + PN[s], 0) + st.pl.q;

  /* ---- learning: mostly new skills at the working level, plus review ---- */
  function next(st, s) {
    let up = false;
    if (st.sup && st.sup.s === s) { const g = st.sup.g; st.sup = null; const p = at(s, g); if (p.length) return { skill: pick(p), s, mode: 'support' }; }
    let cur = at(s, st.lvl[s]).filter(k => !mastered(st, k.id));
    while (!cur.length && st.lvl[s] < MAXG) { st.lvl[s]++; st.rec[s] = []; up = true; cur = at(s, st.lvl[s]).filter(k => !mastered(st, k.id)); }
    const older = Skills.list.filter(k => k.s === s && (k.g < st.lvl[s] || mastered(st, k.id)) && k.g >= st.lvl[s] - 3);
    if (older.length && (!cur.length || Math.random() < 0.2)) {
      const t = k => (st.sk[k.id] || {}).t || 0, min = Math.min(...older.map(t));
      return { skill: pick(older.filter(k => t(k) <= min + 6e5)), s, mode: 'review', up };
    }
    if (!cur.length) cur = at(s, st.lvl[s]);
    let c = cur.filter(k => k.id !== st.lastSk); if (!c.length) c = cur;
    const w = c.map(k => 1.2 - ((st.sk[k.id] || {}).m || 0)); let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
    while (i < c.length - 1 && (r -= w[i]) > 0) i++;
    return { skill: c[i], s, mode: 'learn', up };
  }

const Store = (function () {

  };
  const ABC = 'BCDFGHJKLMNPQRSTVWXYZ23456789';

  let mode = 'demo', auth = null, fdb = null, note = '';

  /* ---------- demo ---------- */
  const D = () => LS.get('wkq_demo') || { teacher: null, classes: {} };
  const demo = {
    async teacher() { return D().teacher; },
    async signIn() { const d = D(); d.teacher = { uid: 'demo', name: 'Demo Teacher', email: 'demo.teacher@ddsb.ca' }; LS.set('wkq_demo', d); return d.teacher; },
    async signOut() { const d = D(); d.teacher = null; LS.set('wkq_demo', d); },
    async createClass(c) { const d = D(); let code = newCode(); while (d.classes[code]) code = newCode(); d.classes[code] = { code, name: c.name, grade: c.grade, teacherUid: 'demo', teacherName: 'Demo Teacher', created: Date.now(), students: {} }; LS.set('wkq_demo', d); return d.classes[code]; },
    async listClasses() { return Object.values(D().classes).map(c => Object.assign({}, c, { count: Object.keys(c.students).length })); },
    async deleteClass(code) { const d = D(); delete d.classes[code]; LS.set('wkq_demo', d); },
    async getClass(code) { return D().classes[code] || null; },
    async listStudents(code) { const c = D().classes[code]; return c ? Object.keys(c.students).map(id => Object.assign({ id }, c.students[id])) : []; },
    async addStudent(code, s) { const d = D(), id = 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e4); d.classes[code].students[id] = Object.assign({ upd: Date.now() }, s); LS.set('wkq_demo', d); return id; },
    async saveStudent(code, id, s) { const d = D(); if (!d.classes[code] || !d.classes[code].students[id]) return; Object.assign(d.classes[code].students[id], s, { upd: Date.now() }); LS.set('wkq_demo', d); },

  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
  const isT = u => !!u && !u.isAnonymous && !!u.email && CONFIG.teacherDomains.includes(u.email.split('@')[1].toLowerCase());
  const tObj = u => ({ uid: u.uid, name: u.displayName || u.email, email: u.email });
  const anon = async () => { if (!auth.currentUser) await auth.signInAnonymously(); };
  const clean = o => JSON.parse(JSON.stringify(o));
  const C = code => fdb.collection('classes').doc(code), SC = code => C(code).collection('students');
  const live = {
    async teacher() { return isT(auth.currentUser) ? tObj(auth.currentUser) : null; },
    async signIn() {
      const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ hd: CONFIG.teacherDomains[0], prompt: 'select_account' });
      const r = await auth.signInWithPopup(p);
      if (!isT(r.user)) { await auth.signOut(); throw new Error('Please sign in with your staff account (@' + CONFIG.teacherDomains.join(' or @') + ').'); }
      return tObj(r.user);
    },
    async signOut() { await auth.signOut(); },
    async createClass(c) {
      const u = auth.currentUser; let code = newCode(); while ((await C(code).get()).exists) code = newCode();
      const cls = { code, name: c.name, grade: c.grade, teacherUid: u.uid, teacherName: u.displayName || '', created: Date.now() }; await C(code).set(cls); return cls;
    },
    async listClasses() { const q = await fdb.collection('classes').where('teacherUid', '==', auth.currentUser.uid).get(); return q.docs.map(d => d.data()); },
    async deleteClass(code) { const q = await SC(code).get(); await Promise.all(q.docs.map(d => d.ref.delete())); await C(code).delete(); },
    async getClass(code) { await anon(); const d = await C(code).get(); return d.exists ? d.data() : null; },
    async listStudents(code) { await anon(); const q = await SC(code).get(); return q.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async addStudent(code, s) { await anon(); const r = await SC(code).add(clean(Object.assign({ upd: Date.now() }, s))); return r.id; },
    async saveStudent(code, id, s) { await anon(); await SC(code).doc(id).set(clean(Object.assign({ upd: Date.now() }, s)), { merge: true }); },
    async removeStudent(code, id) { await SC(code).doc(id).delete(); },
    watchStudents(code, cb) { return SC(code).onSnapshot(q => cb(q.docs.map(d => Object.assign({ id: d.id }, d.data()))), () => { }); }
  };

  async function init() {
    if (!CONFIG.firebase || !CONFIG.firebase.apiKey) return;
    try {
      const v = 'https://www.gstatic.com/firebasejs/10.12.2/';
      await load(v + 'firebase-app-compat.js'); await load(v + 'firebase-auth-compat.js'); await load(v + 'firebase-firestore-compat.js');
      firebase.initializeApp(CONFIG.firebase); auth = firebase.auth(); fdb = firebase.firestore();

      mode = 'live';
    } catch (e) { note = e.message; mode = 'demo'; }
  }
  const api = { LS, init, get mode() { return mode; }, get note() { return note; } };

  return api;
})();

      ${rows.map(r => `<tr data-id="${r.id}"><td><b>${esc(r.name)}</b></td><td>${r.sm.placed ? '<span class="st ok">Playing</span>' : `<span class="st">Training ${r.sm.pc}/${r.sm.pt}</span>`}</td>${E.STR.map(s => `<td>${chip(r.sm.lvl[s], g)}</td>`).join('')}<td>${r.sm.mastered.length}</td><td>${r.sm.acc === null ? '–' : r.sm.acc + '%'}</td><td>${r.sm.tot}</td><td>${r.sm.mins}</td><td>${ago(r.sm.last)}</td></tr>`).join('') || '<tr><td colspan="12" class="muted">No students yet. Share the class code to get started.</td></tr>'}</tbody></table></div><p class="muted">Select a student to see every expectation they have worked on.</p>`;
    } else {
      body = `<div class="legend"><label>Show expectations for <select id="sg">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(x => `<option value="${x}" ${x === T.sg ? 'selected' : ''}>${x ? 'Grade ' + x : 'Kindergarten'}</option>`).join('')}</select></label><span class="grow"></span><span class="key2"><i class="m"></i>mastered <i class="l"></i>practising <i class="s"></i>needs support</span></div>
      <table class="tb"><thead><tr><th>Expectation</th><th>Skill</th><th>Mastered</th><th>Practising</th><th>Needs support</th><th>Class picture</th></tr></thead><tbody>${E.STR.map(s => `<tr class="sep"><td colspan="6">${INFO[s].icon} ${s}. ${INFO[s].name}</td></tr>` + E.at(s, T.sg).map(k => { const m = rows.filter(r => r.sm.mastered.includes(k.id)).length, st = rows.filter(r => r.sm.struggling.includes(k.id)).length, l = rows.filter(r => r.sm.learning.includes(k.id)).length, t = rows.length || 1; return `<tr><td><span class="code">${k.code}</span></td><td>${k.name}</td><td>${m}</td><td>${l}</td><td>${st}</td><td><div class="dist">${m ? `<i class="on" style="width:${m / t * 100}%"></i>` : ''}${l ? `<i class="near" style="width:${l / t * 100}%"></i>` : ''}${st ? `<i class="low" style="width:${st / t * 100}%"></i>` : ''}</div></td></tr>`; }).join('')).join('')}</tbody></table>`;
    }
    show(`<div class="tw">${thead(esc(c.name) + ' · ' + (g ? 'Grade ' + g : 'Kindergarten'))}<main class="tmain"><button class="back dark" id="bk">← All classes</button>
    <section class="invite"><div><span class="muted">Class code</span><code class="bigcode">${c.code}</code></div><div class="ilink"><span class="muted">Students go to this link, tap “I’m a Student”, and pick their name</span><input readonly value="${esc(link)}" id="lnk"><div class="row"><button class="btn sm" id="cp">Copy link</button><button class="btn sm primary" id="bd">Show on the board</button>${Store.mode === 'demo' ? '<button class="btn sm" id="smp">Add sample students</button>' : ''}</div>${Store.mode === 'demo' ? '<span class="muted">Preview mode: students join on this same device with the code. The link works once the game is hosted.</span>' : ''}</div></section>
    <nav class="tabs">${[['overview', 'Overview'], ['students', 'Students'], ['skills', 'Curriculum expectations']].map(t => `<button class="${T.tab === t[0] ? 'sel' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav><section class="tbody">${body}</section>
    <div class="danger"><button class="btn sm" id="delc">Delete this class</button></div></main></div>`, 'bg-paper');
    bindHead(); on('#bk', () => viewClasses()); on('.tabs button', e => { T.tab = e.currentTarget.dataset.t; renderClass(); });
    on('#cp', e => { try { navigator.clipboard.writeText(link).then(() => e.target.textContent = 'Copied ✓'); } catch (er) { $('#lnk').select(); } });
    on('#bd', () => board(c, link)); on('#sg', e => { T.sg = +e.target.value; renderClass(); }, 'change');
    on('.stu tr[data-id]', e => detail(e.currentTarget.dataset.id));
    on('#tsv', e => { const t = [['Student', 'Status', ...E.STR.map(s => INFO[s].name + ' (working grade)'), ...E.STR.map(s => INFO[s].name + ' (starting grade)'), 'Skills mastered', 'Accuracy %', 'Questions', 'Minutes'].join('\t')].concat(rows.map(r => [r.name, r.sm.placed ? 'Playing' : 'Training', ...E.STR.map(s => r.sm.lvl[s] === undefined ? '' : E.gl(r.sm.lvl[s])), ...E.STR.map(s => r.sm.plv[s] === undefined ? '' : E.gl(r.sm.plv[s])), r.sm.mastered.length, r.sm.acc === null ? '' : r.sm.acc, r.sm.tot, r.sm.mins].join('\t'))).join('\n'); try { navigator.clipboard.writeText(t).then(() => e.target.textContent = 'Copied ✓ Paste into Sheets'); } catch (er) { } });
    on('#smp', async () => { const names = ['Aaliyah B.', 'Ben T.', 'Chloe M.', 'Devon S.', 'Emma L.', 'Farid K.', 'Grace W.', 'Hassan A.', 'Isla P.', 'Jayden R.', 'Keira N.', 'Lucas D.'].filter(n => !T.students.some(s => s.name === n)); for (const n of names) await Store.addStudent(c.code, { name: n, crest: pick(CRESTS), st: E.simulate(g, Math.max(0, Math.min(8, g - 1 + pick([-3, -2, -1, -1, 0, 0, 0, 1]))), pick([9, 22, 40, 80, 140])) }); T.students = (await Store.listStudents(c.code)).sort((a, b) => a.name.localeCompare(b.name)); renderClass(); });
    twoStep('#delc', 'Delete this class', 'Yes, delete class and all student data', async () => { if (T.unsub) T.unsub(); await Store.deleteClass(c.code); T.cur = null; viewClasses(); });
  }
  function twoStep(sel, label, sure, fn) { const b = $(sel); if (!b) return; b.addEventListener('click', () => { if (b.dataset.arm) return fn(); b.dataset.arm = 1; b.textContent = sure; b.classList.add('warn'); setTimeout(() => { delete b.dataset.arm; b.textContent = label; b.classList.remove('warn'); }, 4000); }); }
  function board(c, link) {
    const d = document.createElement('div'); d.className = 'board'; d.innerHTML = `<button class="btn" id="bx">Close ✕</button><img class="logo" src="${LOGO}" alt=""><h1>Join ${esc(c.name)}</h1><ol><li>Open <b>${esc(baseUrl().replace(/^https?:\/\//, ''))}</b></li><li>Tap <b>I’m a Student</b></li><li>Type this code:</li></ol><code>${c.code.split('').join(' ')}</code>`;
    document.body.appendChild(d); $('#bx', d).addEventListener('click', () => { d.remove(); renderClass(); });
  }
  function detail(id) {
    const r = T.students.find(s => s.id === id); if (!r) return; const sm = E.summary(r.st), g = T.cur.grade, st = r.st;
    const ids = Object.keys(st.sk).filter(i => Skills.byId[i]).sort((a, b) => { const A = Skills.byId[a], Bk = Skills.byId[b]; return E.STR.indexOf(A.s) - E.STR.indexOf(Bk.s) || A.g - Bk.g; });
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<div class="mcard"><button class="btn sm mx" id="mx">Close ✕</button><h2>${esc(r.name)} <span class="muted">secret crest ${r.crest}</span></h2>
    <p class="muted">${sm.placed ? 'Pre-assessment complete.' : `Still in Knight Training (hidden pre-assessment): ${sm.pc} of ${sm.pt} questions.`} ${sm.tot} questions answered, ${sm.acc === null ? '–' : sm.acc + '%'} correct on the first try, about ${sm.mins} minutes of play. Last active ${ago(sm.last)}.</p>
    <table class="tb"><thead><tr><th>Strand</th><th>Started at</th><th>Working at now</th><th>Skills mastered</th></tr></thead><tbody>${E.STR.map(s => `<tr><td>${INFO[s].icon} ${s}. ${INFO[s].name}</td><td>${chip(sm.plv[s], g)}</td><td>${chip(sm.lvl[s], g)}</td><td>${starsIn(st, s)}</td></tr>`).join('')}</tbody></table>
    <h3>Expectations worked on</h3><div class="scroll tall"><table class="tb"><thead><tr><th>Expectation</th><th>Skill</th><th>Tries</th><th>Correct</th><th>Mastery</th><th>Status</th></tr></thead><tbody>${ids.map(i => { const k = Skills.byId[i], x = st.sk[i], stt = E.mastered(st, i) ? ['on', 'Mastered'] : E.struggling(st, i) ? ['low', 'Needs support'] : ['near', 'Practising']; return `<tr><td><span class="code">${E.gl(k.g)} ${k.code}</span></td><td>${k.name}</td><td>${x.n}</td><td>${x.c}</td><td><div class="dist"><i class="${stt[0]}" style="width:${Math.round(x.m * 100)}%"></i></div></td><td><span class="lv ${stt[0]} wide">${stt[1]}</span></td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Nothing yet.</td></tr>'}</tbody></table></div>
    <div class="danger row"><button class="btn sm" id="rs">Restart pre-assessment</button><button class="btn sm" id="rm">Remove student</button></div></div>`;
    document.body.appendChild(d); const close = () => { d.remove(); renderClass(); };
    $('#mx', d).addEventListener('click', close); d.addEventListener('click', e => { if (e.target === d) close(); });
    twoStep('#rs', 'Restart pre-assessment', 'Yes, clear progress and restart', async () => { const n = E.newState(g); n.coins = st.coins; n.xp = st.xp; n.friends = st.friends; n.gear = st.gear; n.own = st.own; await Store.saveStudent(T.cur.code, id, { st: n }); r.st = n; close(); });
    twoStep('#rm', 'Remove student', 'Yes, remove this student', async () => { await Store.removeStudent(T.cur.code, id); T.students = T.students.filter(s => s.id !== id); close(); });
  }

  /* ================= START ================= */
  window.addEventListener('pagehide', () => { if (me) Store.saveStudent(me.code, me.id, { st: me.st }).catch(() => { }); });
  (async function start() {
    busy('Opening the castle gates…'); await Store.init();
    const m = /[?&]join=([A-Za-z0-9]{4,8})/.exec(location.search) || /^#join-([A-Za-z0-9]{4,8})$/.exec(location.hash), saved = LS.get('wkq_me');
    if (saved && (!m || m[1].toUpperCase() === saved.code)) {
      try { cls = await Store.getClass(saved.code); const s = cls && (await Store.listStudents(saved.code)).find(x => x.id === saved.id); if (s && s.st) { me = { code: saved.code, id: s.id, name: s.name, crest: s.crest, st: s.st }; return viewHub(); } } catch (e) { }
      LS.del('wkq_me');
    }
    if (m) return viewJoin(m[1].toUpperCase());
    viewHome();
  })();
})();

</script>
</body>
</html>
